name: Build & Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- AWS path (uses OIDC, no long-lived secrets) ----
      - name: Configure AWS credentials
        if: vars.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: vars.CLOUD == 'aws'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (AWS)
        if: vars.CLOUD == 'aws'
        env:
          IMG: ${{ secrets.ECR_REPO }}:${{ github.sha }}
        run: |
          docker build -f deployment/docker/Dockerfile -t $IMG .
          docker push $IMG

      # ---- GCP path (Workload Identity Federation) ----
      - name: Authenticate to GCP
        if: vars.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure docker for Artifact Registry
        if: vars.CLOUD == 'gcp'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push image (GCP)
        if: vars.CLOUD == 'gcp'
        env:
          IMG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ vars.GCP_REPO }}/api:${{ github.sha }}
        run: |
          docker build -f deployment/docker/Dockerfile -t $IMG .
          docker push $IMG
