version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: quality-inspection:latest
    container_name: quality-inspection-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      OLLAMA_HOST: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ../../data:/app/data
      - ../../reports:/app/reports

  qdrant:
    image: qdrant/qdrant:latest
    container_name: quality-inspection-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: quality-inspection-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root /mlruns
    volumes:
      - mlflow_data:/mlruns

volumes:
  qdrant_storage:
  mlflow_data:
